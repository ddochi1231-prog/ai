아래 코드를 그대로 복사해 `.html` 파일로 저장하면 됩니다.

```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Creative — 대화 공간</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      font-family: "Pretendard", "Noto Sans KR", -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #192638;
      background: #f3f5f8;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(ellipse at 8% 0%, #e1eafa, transparent 45%),
        radial-gradient(ellipse at 100% 100%, #e6e8f4, transparent 40%),
        #f3f5f8;
    }

    .app {
      max-width: 1440px;
      height: 100vh;
      height: 100dvh;
      margin: auto;
      padding: 28px 40px 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: #263e69;
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 5px 12px #263e6918;
    }

    .logo svg {
      width: 24px;
      height: 24px;
    }

    .brand-name {
      font-size: 16px;
      font-weight: 750;
      letter-spacing: -0.4px;
    }

    .brand-label {
      margin-top: 3px;
      font-size: 11px;
      letter-spacing: 1.6px;
      color: #738096;
    }

    .external {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border: 1px solid #d9dfe8;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      color: #526076;
      text-decoration: none;
      background: #ffffff80;
      transition: background 0.2s;
    }

    .external:hover {
      background: #fff;
    }

    .external:focus-visible {
      outline: 3px solid #7199e4;
      outline-offset: 3px;
    }

    main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .intro {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }

    .eyebrow {
      margin: 0 0 9px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #607aab;
    }

    h1 {
      margin: 0;
      font-size: clamp(23px, 3vw, 34px);
      font-weight: 750;
      letter-spacing: -1.3px;
      line-height: 1.3;
    }

    .description {
      margin: 9px 0 0;
      font-size: 13px;
      color: #738096;
      line-height: 1.6;
    }

    .tag {
      flex-shrink: 0;
      font-size: 11px;
      color: #687992;
      border-radius: 30px;
      border: 1px solid #dce3ee;
      padding: 8px 12px;
    }

    .chat-card {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid #e1e6ee;
      border-radius: 20px;
      box-shadow:
        0 16px 48px #223b6410,
        0 2px 6px #223b6405;
    }

    .chat-bar {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      gap: 12px;
      border-bottom: 1px solid #edf0f5;
    }

    .chat-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 12px;
      font-weight: 650;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: #708dc1;
      border-radius: 50%;
    }

    .chat-subtitle {
      font-size: 11px;
      color: #8b96a8;
    }

    iframe {
      display: block;
      width: 100%;
      flex: 1;
      min-height: 0;
      border: 0;
      background: #fff;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #8b96a8;
      font-size: 10px;
      letter-spacing: 0.2px;
    }

    @media (max-width: 640px) {
      .app {
        padding: 16px 12px 12px;
        gap: 20px;
      }

      .intro {
        align-items: flex-start;
      }

      .tag {
        display: none;
      }

      .brand-label {
        font-size: 9px;
      }

      .external {
        padding: 9px 10px;
        font-size: 11px;
      }

      .description {
        font-size: 12px;
      }

      main {
        gap: 16px;
      }

      .chat-card {
        border-radius: 15px;
      }

      .chat-bar {
        padding: 12px 14px;
        min-height: 48px;
      }

      .chat-subtitle {
        display: none;
      }

      footer {
        font-size: 9px;
      }
    }

    @media (max-height: 600px) {
      .app {
        padding-top: 12px;
        gap: 12px;
      }

      .intro {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="m12 3 2.6 6.4L21 12l-6.4 2.6L12 21l-2.6-6.4L3 12l6.4-2.6L12 3Z"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
          </svg>
        </div>

        <div>
          <div class="brand-name">AI Creative</div>
          <div class="brand-label">YOUR THINKING PARTNER</div>
        </div>
      </div>

      <a
        class="external"
        href="https://copilotstudio.microsoft.com/environments/Default-9ef36566-f756-4f11-9c5f-307c10f409f9/bots/cre46_aicreativeagentteam_XmSQJZ/webchat?__version__=2&amp;enableFileAttachment=false&amp;cliAgent=true"
        target="_blank"
        rel="noopener noreferrer"
      >
        새 창에서 열기
        <span aria-hidden="true">↗</span>
      </a>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">SPACE FOR IDEAS</p>

          <h1 id="page-title">
            좋은 아이디어는 대화에서 시작됩니다.
          </h1>

          <p class="description">
            궁금한 점부터 새로운 영감까지,
            AI와 함께 생각을 이어가세요.
          </p>
        </div>

        <span class="tag">AI 대화 공간</span>
      </section>

      <section class="chat-card" aria-label="AI 챗봇">
        <div class="chat-bar">
          <div class="chat-title">
            <span class="dot" aria-hidden="true"></span>
            Creative Assistant
          </div>

          <span class="chat-subtitle">
            생각을 자유롭게 나눠보세요
          </span>
        </div>

        <iframe
          title="AI Creative 챗봇 대화"
          src="https://copilotstudio.microsoft.com/environments/Default-9ef36566-f756-4f11-9c5f-307c10f409f9/bots/cre46_aicreativeagentteam_XmSQJZ/webchat?__version__=2&amp;enableFileAttachment=false&amp;cliAgent=true"
        ></iframe>
      </section>
    </main>

    <footer>
      <span>Powered by Microsoft Copilot Studio</span>
      <span>AI Creative © 2026</span>
    </footer>
  </div>
</body>
</html>
```
